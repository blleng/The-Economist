name: Downloader

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch downloader from Cloudflare R2
        working-directory: ${{ runner.temp }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 cp s3://cdn/files/scrape.py scrape.py \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --only-show-errors
          if [[ ! -s scrape.py ]]; then
            echo "::error::R2 returned an empty or missing scrape.py"
            exit 1
          fi

      - name: Verify downloader SHA-256
        working-directory: ${{ runner.temp }}
        shell: python
        env:
          EXPECTED_HASH: ${{ secrets.EXPECTED_SCRAPE_HASH }}
        run: |
          import hashlib
          import os
          from pathlib import Path

          expected = os.environ["EXPECTED_HASH"].strip().lower()
          actual = hashlib.sha256(Path("scrape.py").read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit("::error::R2 scrape.py does not match EXPECTED_SCRAPE_HASH")
          print("Verified scrape.py SHA-256")

      - name: Install downloader and browser dependencies
        run: |
          python -m pip install requests beautifulsoup4 py7zr resend \
            playwright==1.64.1 playwright-stealth==2.0.3
          python -m playwright install --with-deps --only-shell chromium

      - name: Configure Git identity
        run: |
          git config --local user.name "blleng"
          git config --local user.email "lengbl@outlook.com"

      - name: Run downloader
        env:
          ECONOMIST_REPO_DIR: ${{ github.workspace }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_TO: ${{ secrets.RESEND_TO }}
        run: python -u "$RUNNER_TEMP/scrape.py"
